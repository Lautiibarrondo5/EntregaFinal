<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GameStore - Videojuegos</title>

    <link rel="stylesheet" href="css/style.css">

    <link 
        rel="stylesheet"
        type="text/css"
        href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

</head>

<body>

    <header>
        <div class="contenedor-header">

            <div>
                <h1>🎮 GameStore</h1>
                <p>Encontrá tus videojuegos favoritos.</p>
            </div>

            <div class="resumen-carrito">
                🛒 Carrito:
                <span id="cantidad-carrito">0</span>
            </div>

        </div>
    </header>

    <main>

        <!-- CATÁLOGO -->
        <section class="catálogo">

            <div class="titulo-seccion">
                <h2>🎮 Catálogo de videojuegos</h2>

                <p>
                    Elegí tus videojuegos y agregalos al carrito.
                </p>
            </div>

            <!-- BUSCADOR -->
            <div class="buscador">

                <label for="buscador">
                    Buscar videojuego 
                </label>

                <input 
                     type="text"
                     id="buscador"
                     placeholder="Escribí el nombre ded un videojuego..."
                >

            </div>

            <!-- MENSAJE -->
             <p id="mensaje"></p>

             <!-- PRODUCTOS -->
              <div id="contenedor-videojuegos">

                <p>
                    Cargando videojuegos... 
                </p>

              </div>

        </section>

        <!-- CARRITO -->
         <section class="carrito">

            <div class="titulo-seccion">

                <h2>🛒 Mi carrito</h2>

                <p>
                    Revisá tus productos antes de confirmar la compra.
                </p>

            </div>

            <!-- PRODUCTOS DEL CARRITO -->
             <div id="contenedor-carrito">

                <p>
                    Tu carrito está vacío.
                </p>

             </div>

             <!-- RESUMEN -->
              <div class="resumen-compra">

                <div>
                    <span>Subtotal:</span>

                    <strong id="total-carrito">
                        $0
                    </strong>
                </div>

                <button
                    type="button"
                    id="btn-vaciar-carrito"
                    >
                    🗑️ Vaciar carrito 
                </button>

                <button
                     type="button"
                     id="btn-confirmar-compra"
                     >
                     ✅ Confirmar compra 
                    </button>

              </div>

         </section>
    </main>

    <footer>

        <p>
            🎮 GameStore - Proyecto Final
        </p>

    </footer>

    <script
         type="text/javascript"
         src="https://cdn.jsdelivr.net/npm/toastify-js">
    </script>

    <script src="js/carrito.js"></script>

    <script src="js/main.js"></script>
    
</body>

</html>
